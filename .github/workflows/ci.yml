name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]
        exclude:
          # Python 3.14 + Windows triggers access violations in pytest's
          # assertion rewrite module (CPython/pytest upstream issue).
          - os: windows-latest
            python-version: "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install radare2
        uses: radareorg/github-actions@v2

      - name: Install dependencies
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
          python -m pip install ruff pip-audit

      - name: Lint
        run: |
          ruff check src tests
          bandit -q -r src -c pyproject.toml

      - name: Type check
        run: mypy src

      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: seifreed/BannedFuncDetector
