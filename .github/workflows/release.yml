name: Release

on:
  push:
    tags:
      - "v[0-9]*"   # e.g. v2.1.0, v3.0.0-rc1

permissions:
  contents: write
  id-token: write   # required for OIDC trusted publishing to PyPI

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required by setuptools-scm to read full tag history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          # Pull the section for this version (## [3.1.0] ...) up to the next
          # "## [" heading so the GitHub Release shows the actual changes.
          number="${VERSION#v}"
          awk -v ver="$number" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          {
            echo ""
            echo "## Installation"
            echo ""
            echo '```bash'
            echo "pip install bannedfuncdetector==${number}"
            echo '```'
          } >> release-notes.md
          echo "----- release notes -----"; cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.get_version.outputs.VERSION }}
          body_path: release-notes.md
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, '-') }}

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bannedfuncdetector
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1